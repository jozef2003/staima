[project]
name = "saemi"
version = "0.1.0"
description = "CRK Lead Agent — weekly real-estate lead briefing"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "playwright>=1.49",
  "feedparser>=6.0",
  "beautifulsoup4>=4.12",
  "python-dateutil>=2.9",
  "pydantic>=2.9",
]

[tool.setuptools]
packages = ["crawlers", "pipeline", "output"]
